# Sanitized reconstruction based on implemented systems.
# Development credentials are for a disposable local environment only.

x-database: &database
  DATABASE_URL: postgresql://showcase:showcase@postgres:5432/showcase

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: showcase
      POSTGRES_USER: showcase
      POSTGRES_PASSWORD: showcase
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showcase -d showcase"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]

  migrate:
    build:
      context: .
      target: runtime
    command: ["node", "dist/migrate.js"]
    environment: *database
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

  api:
    build:
      context: .
      target: runtime
    environment:
      <<: *database
      PORT: "4100"
    ports:
      - "127.0.0.1:4100:4100"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [edge, data]

  worker:
    build:
      context: .
      target: runtime
    command: ["node", "dist/worker.js"]
    environment: *database
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [data]

  test:
    profiles: [test]
    build:
      context: .
      target: test
    environment: *database
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [data]

networks:
  edge:
  data:
    internal: true

volumes:
  postgres-data:
